name: cinema-api-test

services:
  elasticsearch:
    image:  elasticsearch:8.6.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cat/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5      

  fastapi:
    container_name: fastapi
    build:
      dockerfile: devops/Dockerfile.fa
    env_file:
      - .env.test
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./devops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/configs:/etc/nginx/conf.d:ro
    depends_on:
      - fastapi
    ports:
    - "8000:80"  


  tests:
    container_name: tests
    build:
      dockerfile: devops/Dockerfile.tests
    depends_on:
      fastapi:
        condition: service_started

volumes:
  etl_state: