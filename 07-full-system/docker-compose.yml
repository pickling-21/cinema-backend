services:

  # Infrastructure

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./devops/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./film_service/devops/database_dump.sql:/docker-entrypoint-initdb.d/database_dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cinema_net
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.6.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cat/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinema_net
    restart: unless-stopped

  # Auth Service (FastAPI)

  auth:
    container_name: auth
    build:
      context: ./auth
      dockerfile: devops/Dockerfile.auth
    environment:
      PG_DSN: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-example_password}@postgres:5432/auth
      REDIS_DSN: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-me-in-prod}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-15}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinema_net
    restart: unless-stopped

  # Admin Panel (Django)

  django:
    container_name: django
    build:
      context: ./admin_panel/app
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_OPTIONS: "-c search_path=public,content"
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me-in-prod}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: "localhost,127.0.0.1,django,nginx"
    volumes:
      - static_volume:/var/wwww/static
      - media_volume:/var/wwww/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cinema_net
    restart: unless-stopped

  # Film Service (FastAPI)

  fastapi:
    container_name: fastapi
    build:
      context: ./film_service
      dockerfile: devops/Dockerfile.fa
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-me-in-prod}
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinema_net
    restart: unless-stopped

  # ETL Service

  etl:
    container_name: etl
    build:
      context: ./film_service
      dockerfile: devops/Dockerfile.etl
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: movies
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      ELASTIC_INDEX: movies
      CHUNK_SIZE: ${ETL_CHUNK_SIZE:-100}
      SLEEP_TIMEOUT: ${ETL_SLEEP_TIMEOUT:-10.0}
      STATE_FILE: /app/state/state.json
    volumes:
      - etl_state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cinema_net
    restart: unless-stopped

  # Nginx Gateway

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./devops/configs/site.conf:/etc/nginx/conf.d/site.conf:ro
      - ./devops/configs/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/wwww/static:ro
      - media_volume:/var/wwww/media:ro
    ports:
      - "80:80"
    depends_on:
      - auth
      - django
      - fastapi
    networks:
      - cinema_net
    restart: unless-stopped

networks:
  cinema_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elastic_data:
  etl_state:
  static_volume:
  media_volume: